<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 584 384" role="img" aria-labelledby="title desc">
<title id="title">Brandon — welcome in.</title>
<desc id="desc">A pixel chat window: heyyyy., 你好呀。, ¡hola!, i'm Brandon., welcome in. Three greetings arrive in sequence, then the conversation scrolls to the introduction. Plays once.</desc>
<defs>
  <pattern id="wallpaper" width="80" height="64" patternUnits="userSpaceOnUse">
    <rect width="80" height="64" fill="#F5F0DD"/>
    <path d="M14 12h4v4h4v4h-4v4h-4v-4h-4v-4h4z" fill="#DCDAC3"/>
    <path d="M50 40h6v4h6v4h6v4h-10v-4h-8z" fill="#E6DCD4"/>
  </pattern>
  <clipPath id="chat-viewport"><path d="M24 62H552V342H24z"/></clipPath>
</defs>
<style>
  .conversation { transform:translateY(-164px); animation:chat-scroll 8.6s cubic-bezier(.22,.7,.25,1) forwards; }
  .message { animation:message-enter .5s cubic-bezier(.2,.7,.25,1) both; }
  .message-one { animation-delay:.45s; }
  .message-two { animation-delay:1.95s; }
  .message-three { animation-delay:3.65s; }
  .message-name { animation-delay:5.8s; }
  .message-welcome { animation-delay:7.7s; }
  @keyframes message-enter { from {opacity:0;transform:translateY(10px)} to {opacity:1;transform:translateY(0)} }
  @keyframes chat-scroll {
    0%,60% {transform:translateY(0)}
    67%,82% {transform:translateY(-82px)}
    90%,100% {transform:translateY(-164px)}
  }
  @media (prefers-reduced-motion:reduce) {
    .conversation {animation:none;transform:translateY(-164px)}
    .message {animation:none;opacity:1;transform:none}
  }
</style>
